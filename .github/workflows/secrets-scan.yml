---
name: Secrets scan

# Garde-fou contre les secrets commités. Ne remplace pas la discipline
# « jamais de secret commité » (`.agent/RULES.md` § 4) : ce dépôt porte une clé
# d'enrôlement qui permet d'inscrire un faux agent sur le serveur central.

# ⚠️ AUCUN FILTRE `paths` ICI, ET C'EST VOULU (`P00.12`, 2026-09-09).
# Ce contrôle est OBLIGATOIRE à la fusion dans le ruleset `main-protection`.
# Un contrôle requis qui ne se DÉCLENCHE pas ne rend jamais son verdict, et
# GitHub attend indéfiniment : la PR devient infusionnable. Un filtre `paths`
# et un contrôle requis ne vont donc pas ensemble. Le coût est quelques
# secondes de CI sur une PR documentaire ; le prix de l'autre choix est une
# branche bloquée que personne ne sait débloquer.
on:
  push:
    branches:
      - main
  pull_request:

# `pull-requests: read` est requis par gitleaks-action sur un evenement
# `pull_request` : l'action liste les commits de la PR pour ne scanner que la
# plage apportee. Sans ce scope, l'appel rend 403 et le job echoue avant
# d'avoir scanne quoi que ce soit.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
