---
name: Python CI

# ⚠️ AUCUN FILTRE `paths` ICI, ET C'EST VOULU (`P00.12`, 2026-09-09).
# Ce contrôle est OBLIGATOIRE à la fusion dans le ruleset `main-protection`.
# Un contrôle requis qui ne se DÉCLENCHE pas ne rend jamais son verdict, et
# GitHub attend indéfiniment : la PR devient infusionnable. Un filtre `paths`
# et un contrôle requis ne vont donc pas ensemble. Le coût est quelques
# secondes de CI sur une PR documentaire ; le prix de l'autre choix est une
# branche bloquée que personne ne sait débloquer.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: ruff & pytest
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Version de ruff ÉPINGLÉE : les règles de format bougent entre releases,
      # et un gate stable exige la même version qu'en dev.
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.6.*" "pytest==8.*"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # `responder/` est vide en phase 0. `pytest` rend 5 (« no tests collected »)
      # dans ce cas : c'est un état attendu, pas un échec. Il cessera de l'être
      # dès le premier test — et alors un vrai échec redeviendra rouge.
      - name: pytest
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ $code -eq 5 ]; then
            echo "Aucun test collecte (phase 0) — voir responder/README.md"
            exit 0
          fi
          exit $code
        shell: bash
