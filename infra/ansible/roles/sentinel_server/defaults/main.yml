---
# Rôle `sentinel_server` — serveur central Wazuh, PROFIL FRUGAL.
# Décidé par ADR-001 (moteur) et ADR-003 (hôte : patator-standby).
#
# Tout ce qui est ici se surcharge. Les invariants sont dans `vars/main.yml`.

# --- La garde d'armement ----------------------------------------------------
# `false`, et cette valeur NE CHANGE JAMAIS dans le dépôt (`RULES` § 1).
# Désarmé : les paquets sont posés, la configuration rendue, l'unité installée
# — mais NI activée NI démarrée. Un `--check` montre alors exactement ce que
# l'armement fera, avant que quiconque l'arme.
#
# Armer :  ansible-playbook playbooks/01_server.yml -e '{"sentinel_server_enabled": true}'
# La forme JSON n'est pas du style : `-e x=true` passe une CHAÎNE, et
# `00_garde.yml` la refuse pour cette raison.
sentinel_server_enabled: false

# --- Version du moteur — ÉPINGLÉE, à un seul endroit ------------------------
# Une version flottante fait d'un `apply` de routine une mise à jour non
# décidée du moteur de sécurité, sur une machine de production. Cette valeur
# est aussi celle des agents (`P01.1`) : manager et agents partagent la
# version majeure, et c'est le rôle serveur qui la porte.
#
# ⚠️ Le choix du MINEUR n'est pas neutre pour `D4` (inventaire de
# vulnérabilités, lot `P01.9`) : voir le README du rôle, § « Le mineur et `D4` ».
#
# TRANCHÉ le 2026-09-09 par le PO (`P01.10`, issue **B**) : on monte sur la
# branche courante et `D4` se produira autrement. Le motif est écrit dans
# `docs/releves/P01.10` : rester en `4.7.5` posait sur deux machines de
# production un composant privilégié figé à ~2 ans de correctifs, pour ne
# gagner que la source du rapport le moins critique des quatre.
#
# `4.14.7` est la version la plus récente servie par le dépôt de l'éditeur au
# 2026-09-09 (relevée dans l'index apt, 74 versions publiées, `4.14.7-1` en
# tête) et correspond aux notes de version du 2026-07-29.
sentinel_server_wazuh_version: "4.14.7"

# Empreinte de la clé de dépôt. Le rôle la VÉRIFIE et refuse d'installer si
# elle ne correspond pas. La chaîne d'approvisionnement est la menace n° 2 du
# classement `B1` : un dépôt de paquets ajouté sans vérifier sa clé est
# exactement cette menace, installée de nos propres mains.
sentinel_server_repo_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"

# ✅ EMPREINTE CONFIRMÉE le 2026-09-09 (arbitrage `A2` du PO), sur DEUX
# infrastructures distinctes — une empreinte relevée sur la seule source qui
# sert la clé ne vérifie rien : elle se compare à elle-même.
#
#   canal 1 — CDN de paquets de l'éditeur (packages.wazuh.com)
#   canal 2 — keys.openpgp.org, serveur de clés indépendant de l'éditeur
#   les deux rendent : 0DCFCA5547B19D2A6099506096B3EE5F29111145
#
#   clé : RSA 4096, créée le 2016-08-01,
#   uid « Wazuh.com (Wazuh Signing Key) <support@wazuh.com> »
#
# La commande de revérification, à rejouer à chaque changement de dépôt :
#   curl -fsSL https://packages.wazuh.com/key/GPG-KEY-WAZUH \
#     | gpg --show-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}'
#
# ⚠️ LA CLÉ EXPIRE LE 2027-05-15. Ce n'est pas une remarque de style : à cette
# date `apt` refusera le dépôt, et la mise à jour du moteur s'arrêtera sans que
# personne ne l'ait demandé. La revue d'`ADR-003` est datée du 2027-03-07, donc
# AVANT — c'est là que ce point se reprend.
#
# Ce que le canal 2 prouve, et ce qu'il ne prouve pas : il exclut qu'un CDN
# seul ait été détourné, puisqu'une seconde infrastructure porte la même
# empreinte. Il n'établit pas que l'éditeur contrôle l'adresse de courriel de
# l'uid. Pour cette menace (`B1` n° 2), c'est la vérification proportionnée ;
# ce n'est pas une chaîne de confiance forte, et l'écrire évite de le croire.
#
# Si un jour les deux canaux divergent : ne pas installer, et le dire. C'est
# exactement le cas que ce contrôle existe pour attraper.
#
# `gitleaks:allow` — 40 caractères hexadécimaux à forte entropie, donc reconnus
# comme une « generic-api-key ». C'est un FAUX POSITIF, et il est de la meilleure
# espèce : une empreinte de clé publique est faite pour être publiée. Sa valeur
# tient précisément à ce que tout le monde puisse la comparer. La garder secrète
# n'aurait aucun sens — on ne pourrait plus vérifier la clé contre elle.
#
# Ce commentaire ne couvre que les commits À VENIR qui toucheront cette ligne.
# Le commit qui l'a introduite est éteint par `.gitleaksignore` : le gate scanne
# l'historique, pas l'arbre de travail. La valeur, elle, n'a pas bougé au
# relevé du 2026-09-09 — elle était juste ; c'est le drapeau qui manquait.
sentinel_server_repo_key_fingerprint: "0DCFCA5547B19D2A6099506096B3EE5F29111145"  # gitleaks:allow
sentinel_server_repo_key_confirmee: true
sentinel_server_repo_url: "https://packages.wazuh.com/4.x/apt/"
sentinel_server_repo_composant: "main"
sentinel_server_repo_suite: "stable"

# --- Écoute — condition 3 d'ADR-003 -----------------------------------------
# L'interface vient de l'inventaire (`sentinel_server_listen_interface`).
# L'ADRESSE, elle, est résolue SUR LA MACHINE à partir des faits : la figer ici
# reviendrait à graver une IP de tailnet dans le dépôt, et elle changera.
sentinel_server_port_evenements: 1514
sentinel_server_port_enrolement: 1515
sentinel_server_port_api: 55000

# --- Le `.env` de la machine ------------------------------------------------
# Les secrets vivent LÀ, jamais dans l'inventaire, jamais dans le dépôt.
# Le rôle pose des permissions ; il ne pose pas de valeurs (`RULES` § 4).
sentinel_server_env_file: "{{ sentinel_install_dir }}/.env"

# --- Rétention des journaux (G1) --------------------------------------------
# 90 jours en ligne, 12 mois d'archive compressée.
sentinel_server_retention_jours: 90
sentinel_server_archive_mois: 12

# --- Propriété des fichiers posés -------------------------------------------
sentinel_server_owner: "root"
sentinel_server_group: "wazuh"
sentinel_server_config_mode: "0640"
sentinel_server_secret_mode: "0600"

# --- Désinstallation --------------------------------------------------------
# `false` par défaut, évidemment. La désinstallation est un geste explicite :
#   ansible-playbook playbooks/01_server.yml -e '{"sentinel_server_desinstaller": true}'
# C'est la réversibilité promise par ADR-001, rendue jouable plutôt qu'écrite.
sentinel_server_desinstaller: false
# Purger l'ÉTAT (journaux, base des agents) en plus des paquets. Séparé de la
# désinstallation : retirer le logiciel et détruire les preuves ne sont pas le
# même geste, et le second ne s'improvise pas (`RULES` § 4 — les journaux
# décrivent l'infrastructure entière).
sentinel_server_purger_etat: false
