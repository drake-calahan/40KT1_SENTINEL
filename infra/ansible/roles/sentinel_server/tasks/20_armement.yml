---
# Armement du serveur central.
#
# ══ ON N'ARRIVE ICI QUE PAR UN GESTE HUMAIN ════════════════════════════════
#   ansible-playbook playbooks/01_server.yml -e '{"sentinel_server_enabled": true}'
# joué en déroulant un runbook. Jamais par un merge, jamais par un `apply` de
# routine (`RULES` § 1).
#
# Armer le SERVEUR n'arme aucune réponse : le catalogue reste fermé et
# l'exécuteur n'est pas câblé (`P03.x`). Ce qu'on arme ici, c'est l'écoute et
# la collecte — la première ligne du tableau d'armement d'ACTIVE.md.
# ═══════════════════════════════════════════════════════════════════════════

# Le désarmement d'urgence est un frein hors bande : SSH et un `touch`. Il est
# lu ICI, au dernier moment — entre la garde et l'armement, quelqu'un a pu le
# poser.
- name: Lire le témoin de désarmement d'urgence
  ansible.builtin.stat:
    path: "{{ sentinel_disarm_file }}"
  register: sentinel_server_temoin_desarmement
  become: true
  failed_when: false
  changed_when: false

- name: Refuser d'armer si le témoin est présent, ou si on n'a pas pu le lire
  ansible.builtin.fail:
    msg: >-
      {{
        "ARMEMENT REFUSÉ : le témoin de désarmement " ~ sentinel_disarm_file
        ~ " est PRÉSENT. Quelqu'un l'a posé ; il se retire par le même geste, "
        ~ "à la main, jamais par un playbook."
        if ('stat' in sentinel_server_temoin_desarmement
            and sentinel_server_temoin_desarmement.stat.exists)
        else
        "ARMEMENT REFUSÉ : le témoin de désarmement " ~ sentinel_disarm_file
        ~ " n'a pas pu être LU. État inconnu — et un `ok` n'est pas un "
        ~ "`inconnu` (.agent/RULES.md § 1). On n'arme pas sur une mesure "
        ~ "qu'on n'a pas pu prendre."
      }}
  when: >-
    'stat' not in sentinel_server_temoin_desarmement
    or sentinel_server_temoin_desarmement.stat.exists

# Le bornage est la condition 1 d'ADR-003. Armer sans lui fait cohabiter le
# moteur avec le miroir Postgres et la relève SANS plafond mémoire, sur 16 Go.
# La condition serait alors déclarative — exactement ce qu'ADR-003 refuse.
- name: Refuser d'armer sans bornage des ressources
  ansible.builtin.fail:
    msg: >-
      ARMEMENT REFUSÉ : le bornage cgroup n'est pas posé
      (/etc/systemd/system/{{ sentinel_server_unite }}.d/sentinel-bornage.conf).
      C'est la condition 1 d'ADR-003, et elle n'est pas négociable sur cet hôte :
      le standby porte le miroir Postgres et la relève en lecture seule sur
      16 Go. Jouer d'abord le lot P01.4, puis revenir armer.
  when: >-
    'stat' not in sentinel_server_bornage
    or not sentinel_server_bornage.stat.exists

# ── Appliquer la configuration AVANT de la mesurer ────────────────────────
# Les tâches de pose notifient « redemarrer le serveur central », et un handler
# ne s'exécute qu'en FIN de play. Or la mesure d'écoute ci-dessous tombe AVANT
# cette fin : sur un serveur déjà armé, elle mesurait donc le moteur encore
# lancé avec l'ANCIENNE configuration. Mesuré le 2026-09-14 en refermant la
# fenêtre d'enrôlement sur patator-standby : `ossec.conf` disait « authd
# fermé », le moteur tournait toujours avec authd sur 0.0.0.0, le contrôle
# a refusé à juste titre — et comme le play échouait, le redémarrage en
# attente n'a JAMAIS eu lieu. La fenêtre restait ouverte, playbook rouge.
#
# `flush_handlers` joue le redémarrage en attente ICI, puis on démarre (sans
# effet s'il vient d'avoir lieu) et on mesure ce que la configuration décrit.
- name: Appliquer maintenant les redémarrages en attente
  ansible.builtin.meta: flush_handlers

- name: Activer et démarrer le serveur central
  ansible.builtin.systemd_service:
    name: "{{ sentinel_server_unite }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

# ── La vérification qui rend la condition 3 d'ADR-003 vérifiable ──────────
# « Écoute sur tailscale0 uniquement » ne vaut que si on le MESURE. On le
# mesure ici, après démarrage, et on échoue si une socket du moteur écoute
# ailleurs — y compris sur 0.0.0.0, qui couvre le LAN.
- name: Relever les sockets en écoute du moteur
  ansible.builtin.command:
    cmd: ss -lntpH
  become: true
  register: sentinel_server_sockets
  changed_when: false
  # En `--check`, l'unité n'a pas été démarrée : la mesure n'a pas de sens.
  # On ne la simule pas — on l'annonce non prise (voir le bilan).
  when: not ansible_check_mode

# Deux corrections, mesurées en préparant l'enrôlement du MVP (2026-09-14) :
#
# 1. Le filtre ne regardait que les lignes contenant « wazuh ». L'API du moteur
#    est un processus `python3` : si elle se liait un jour à 0.0.0.0, ce
#    contrôle ne l'aurait pas vue. On sélectionne donc AUSSI par port — les
#    trois ports que ce rôle ouvre.
# 2. La fenêtre d'enrôlement (`sentinel_server_authd_ouvert`) fait écouter
#    `wazuh-authd` sur 0.0.0.0, et Wazuh ne sait pas faire autrement. Le runbook
#    demande d'ouvrir la fenêtre en armant : ce contrôle échouait donc
#    SYSTÉMATIQUEMENT sur le geste documenté, service démarré et play rouge.
#    Un contrôle qui échoue sur la procédure écrite apprend à ignorer le rouge.
#    L'exception est NOMMÉE et bornée : authd, port d'enrôlement, drapeau
#    explicite — et elle s'affiche en avertissement à chaque passage.
- name: Relever les sockets du moteur qui écoutent hors du tailnet
  ansible.builtin.set_fact:
    sentinel_server_sockets_hors_tailnet: >-
      {{ sentinel_server_sockets.stdout_lines
         | select('search', 'wazuh|:(' ~ sentinel_server_port_evenements ~ '|'
                  ~ sentinel_server_port_enrolement ~ '|' ~ sentinel_server_port_api ~ ')\s')
         | reject('search', sentinel_server_listen_ip | regex_escape)
         | list }}
  when: not ansible_check_mode

- name: Isoler l'exception de la fenêtre d'enrôlement, si elle est ouverte
  ansible.builtin.set_fact:
    sentinel_server_sockets_fenetre: >-
      {{ (sentinel_server_sockets_hors_tailnet
          | select('search', 'wazuh-authd')
          | select('search', ':' ~ sentinel_server_port_enrolement ~ '\s')
          | list)
         if (sentinel_server_authd_ouvert | bool) else [] }}
  when: not ansible_check_mode

- name: Aucune socket du moteur n'écoute hors du tailnet
  ansible.builtin.assert:
    that:
      - sentinel_server_sockets_hors_tailnet
        | difference(sentinel_server_sockets_fenetre) | length == 0
    fail_msg: >-
      ÉCOUTE HORS TAILNET détectée. Une socket du moteur écoute sur autre chose
      que {{ sentinel_server_listen_ip }} ({{ sentinel_server_listen_interface }}) :
      {{ sentinel_server_sockets_hors_tailnet
         | difference(sentinel_server_sockets_fenetre) | join(' | ') }}
      C4 est formel — tailnet UNIQUEMENT, jamais Funnel, jamais cloudflared,
      jamais le nom public. `ufw` ne rattrape pas cela de façon fiable : il ne
      couvre pas les ports publiés par Docker (.agent/DISCOVERY.md). Désarmer,
      corriger l'écoute, réarmer.
    success_msg: >-
      écoute : {{ sentinel_server_listen_ip }} seulement — condition 3
      d'ADR-003 vérifiée, pas seulement déclarée
      {{- " (hors fenêtre d'enrôlement, signalée ci-dessous)"
          if sentinel_server_sockets_fenetre | length > 0 else '' }}
    quiet: true
  when: not ansible_check_mode

- name: AVERTIR — la fenêtre d'enrôlement expose authd au LAN
  ansible.builtin.debug:
    msg:
      - "⚠️ FENÊTRE D'ENRÔLEMENT OUVERTE — exception tolérée, pas un état nominal."
      - "{{ sentinel_server_sockets_fenetre | join(' | ') }}"
      - >-
        wazuh-authd écoute hors tailnet (Wazuh ne sait pas le lier à une
        interface). Inscrire les agents, PUIS refermer en rejouant ce playbook
        SANS sentinel_server_authd_ouvert. Tant que cette ligne s'affiche, C4
        n'est pas tenu sur le port {{ sentinel_server_port_enrolement }}.
  when:
    - not ansible_check_mode
    - sentinel_server_sockets_fenetre | default([]) | length > 0

- name: Consigner que le serveur central a été armé
  ansible.builtin.debug:
    msg: >-
      ARMÉ : {{ sentinel_server_unite }} sur {{ inventory_hostname }}, écoute
      {{ sentinel_server_listen_ip }}. Mode tournoi lu :
      {{ sentinel_server_mode_tournoi }}. AUCUNE réponse automatique n'est armée
      pour autant — le catalogue reste fermé (ADR-002 § 6, cinq portes).
      Mettre à jour le tableau d'armement de .agent/ACTIVE.md : c'est lui qui
      répond à « qu'est-ce qui tourne sur cette machine ? ».
