---
# Pose du serveur central : dépôt vérifié, paquet épinglé, configuration rendue.
#
# ── CE FICHIER NE DÉMARRE RIEN ─────────────────────────────────────────────
# Le paquet `wazuh-manager` installe une unité systemd. Sur Debian et dérivés,
# un paquet peut démarrer son service à l'installation : c'est exactement le
# genre d'armement par effet de bord que RULES § 1 interdit. La parade est
# posée AVANT le paquet (« policy-rc.d », plus bas) et retirée après.
# ═══════════════════════════════════════════════════════════════════════════

# La cadence FIM est écrite « 12h » dans group_vars, et `syscheck` veut des
# secondes. Même conversion que dans le rôle agent — les deux nœuds doivent
# lire la même valeur, sinon « toutes les 12 h » ne veut pas dire la même chose
# des deux côtés du parc.
- name: Convertir la cadence FIM en secondes pour syscheck
  ansible.builtin.set_fact:
    sentinel_server_fim_frequency_seconds: >-
      {{
        (sentinel_fim_scan_interval[:-1] | int * 3600)
        if sentinel_fim_scan_interval is match('^[0-9]+h$')
        else (
          (sentinel_fim_scan_interval[:-1] | int * 60)
          if sentinel_fim_scan_interval is match('^[0-9]+m$')
          else (sentinel_fim_scan_interval | int)
        )
      }}
  changed_when: false

# ── 1. La clé du dépôt, vérifiée avant d'être posée ───────────────────────
- name: Créer le répertoire des trousseaux
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# `/tmp` est mondialement inscriptible et un nom fixe s'y devine. La clé y
# passait par trois opérations — écriture, relevé d'empreinte, dé-blindage —
# avec une fenêtre entre le contrôle et l'usage. Un répertoire créé pour
# l'occasion (`0700`, root) supprime la fenêtre plutôt que de la rétrécir.
# `P01.16`, ouvert par la revue de `P01.1`.
- name: Créer un répertoire temporaire privé pour la clé du dépôt
  ansible.builtin.tempfile:
    state: directory
    prefix: sentinel-repo-key.
  become: true
  register: sentinel_server_cle_repertoire
  check_mode: false

- name: Télécharger la clé du dépôt dans ce répertoire
  ansible.builtin.get_url:
    url: "{{ sentinel_server_repo_key_url }}"
    dest: "{{ sentinel_server_cle_repertoire.path }}/GPG-KEY-WAZUH"
    owner: root
    group: root
    mode: "0600"
  become: true
  register: sentinel_server_cle_telechargee
  # En `--check`, `get_url` ne télécharge pas : la vérification d'empreinte qui
  # suit n'a alors rien à lire. On le DIT plutôt que de laisser un `skipped`
  # passer pour un contrôle réussi.
  check_mode: false

- name: Relever l'empreinte de la clé effectivement servie
  ansible.builtin.command:
    cmd: >-
      gpg --show-keys --with-colons
      {{ sentinel_server_cle_repertoire.path }}/GPG-KEY-WAZUH
  become: true
  register: sentinel_server_empreinte_relevee
  changed_when: false
  check_mode: false

- name: L'empreinte servie correspond à l'empreinte attendue
  ansible.builtin.assert:
    that:
      - sentinel_server_empreinte_relevee.stdout is search(sentinel_server_repo_key_fingerprint)
    fail_msg: >-
      EMPREINTE NON CONFORME. La clé servie par
      {{ sentinel_server_repo_key_url }} ne porte pas l'empreinte attendue
      ({{ sentinel_server_repo_key_fingerprint }}). NE PAS INSTALLER, NE PAS
      « réessayer », NE PAS mettre à jour l'empreinte pour faire passer le
      contrôle : c'est précisément le cas que ce contrôle existe pour attraper
      (menace n° 2 du classement B1). Prévenir le PO.
    success_msg: "empreinte de la clé de dépôt : conforme"
    quiet: true

- name: Poser la clé du dépôt dans son propre trousseau
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /usr/share/keyrings/sentinel-wazuh.gpg
      {{ sentinel_server_cle_repertoire.path }}/GPG-KEY-WAZUH
    creates: /usr/share/keyrings/sentinel-wazuh.gpg
  become: true

- name: Retirer le répertoire temporaire de la clé
  ansible.builtin.file:
    path: "{{ sentinel_server_cle_repertoire.path }}"
    state: absent
  become: true
  when: sentinel_server_cle_repertoire.path is defined

# ── 2. Le dépôt, signé par CE trousseau et par aucun autre ────────────────
# `signed-by` est le point : sans lui, la clé posée signerait n'importe quel
# dépôt de la machine, y compris ceux de HQ. Sentinelle ajoute, elle n'élargit
# pas la confiance des autres.
- name: Déclarer le dépôt de paquets du moteur
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/sentinel-wazuh.gpg]
      {{ sentinel_server_repo_url }} {{ sentinel_server_repo_suite }}
      {{ sentinel_server_repo_composant }}
    filename: sentinel-wazuh
    state: present
    update_cache: true
  become: true

# ── 3. Le paquet, à une version épinglée — et qui le RESTE ────────────────
# Deux gardes, parce qu'une seule ne tient pas :
#   - `apt preferences` empêche apt de proposer une version plus récente ;
#   - `apt-mark hold` empêche `unattended-upgrades` de la poser quand même.
# Les deux nœuds tournent `unattended-upgrades` : sans le `hold`, le moteur de
# sécurité se met à jour tout seul, une nuit, sans que personne ne l'ait décidé.
- name: Épingler la version du moteur au niveau d'apt
  ansible.builtin.template:
    src: apt-preferences-wazuh.j2
    dest: /etc/apt/preferences.d/sentinel-wazuh.pref
    owner: root
    group: root
    mode: "0644"
  become: true

# Sur Debian et dérivés, l'installation d'un paquet DÉMARRE son service. Ce
# fichier fait échouer proprement toute tentative de démarrage pendant la pose,
# et il est retiré juste après. Sans lui, `sentinel_server_enabled: false` ne
# voudrait rien dire : le moteur tournerait dès l'installation.
- name: Interdire tout démarrage de service pendant l'installation
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Posé par 40KT1_SENTINEL, rôle sentinel_server, le temps de l'installation.
      # Rien ne démarre pendant une pose : armer est un geste d'exploitation
      # (.agent/RULES.md § 1). Ce fichier est retiré à la fin du rôle.
      exit 101
    dest: /usr/sbin/policy-rc.d
    owner: root
    group: root
    mode: "0755"
  become: true

# Sur un hôte VIERGE en `--check`, la tâche précédente n'a pas écrit le fichier
# de dépôt : `apt` ne connaît donc pas encore `wazuh-manager`, et le module
# échouait avec « No package matching 'wazuh-manager' is available ». Le dépôt
# IMPOSE `--check --diff` en premier geste : ce contrôle obligatoire s'arrêtait
# donc là, avant d'avoir montré quoi que ce soit de la configuration, du secret
# ou des règles — c'est-à-dire au seul moment où on en a besoin. Mesuré en
# répétition à blanc sur un conteneur vierge, 2026-09-10 (`P01.20`).
- name: Relever si le dépôt du moteur est déjà déclaré sur la machine
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/sentinel-wazuh.list
  become: true
  register: sentinel_server_depot_present
  changed_when: false

- name: Installer le moteur, à la version épinglée
  ansible.builtin.apt:
    name: "{{ sentinel_server_paquet }}={{ sentinel_server_wazuh_version }}-*"
    state: present
    update_cache: true
  become: true
  # Hors `--check`, la tâche s'exécute toujours : le dépôt vient d'être déclaré
  # pour de bon juste au-dessus. En `--check`, elle ne s'exécute que si le dépôt
  # était DÉJÀ là — sinon on demanderait à apt un paquet d'un dépôt qui n'existe
  # pas encore sur cette machine.
  when: not ansible_check_mode or sentinel_server_depot_present.stat.exists
  notify: redemarrer le serveur central

- name: Signaler que l'installation n'a pas pu être simulée — attendu en `--check`
  ansible.builtin.set_fact:
    sentinel_server_points_signales: >-
      {{ sentinel_server_points_signales + [
           "Installation de " ~ sentinel_server_paquet ~ " NON SIMULÉE : le "
           ~ "dépôt de paquets n'est pas encore déclaré sur cette machine, "
           ~ "donc apt ne connaît pas le paquet. Ce --check ne prouve donc PAS "
           ~ "que la version " ~ sentinel_server_wazuh_version ~ " est servie "
           ~ "par le dépôt. Rejouer un --check APRÈS le premier apply le "
           ~ "prouvera ; c'est la limite d'un contrôle joué sur un hôte vierge."
         ] }}
  when:
    - ansible_check_mode
    - not sentinel_server_depot_present.stat.exists

- name: Geler la version contre les mises à jour automatiques
  ansible.builtin.dpkg_selections:
    name: "{{ sentinel_server_paquet }}"
    selection: hold
  become: true
  # Même motif : `dpkg` ne connaît pas un paquet qui n'est pas installé.
  when: not ansible_check_mode or sentinel_server_depot_present.stat.exists

- name: Lever l'interdiction de démarrage
  ansible.builtin.file:
    path: /usr/sbin/policy-rc.d
    state: absent
  become: true

# ── 4. L'unité est installée, et elle reste ARRÊTÉE ───────────────────────
# `daemon_reload` rend l'unité visible à `systemctl status` sans l'activer.
# Ni `enabled`, ni `state` : ce qui démarre vit dans `20_armement.yml`.
- name: Recharger le gestionnaire de services sans rien démarrer
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# En `--check`, `apt` n'installe rien : l'unité n'existe pas encore, et
# `systemd_service` échouait dessus. Le dépôt IMPOSE `--check --diff` en premier
# geste — le contrôle obligatoire ne rendait donc jamais son verdict la première
# fois, c'est-à-dire au seul moment où on en a besoin. `P01.15`.
#
# Absente ne veut pas dire la même chose des deux côtés, et c'est tout l'enjeu :
# en `--check` c'est NORMAL (rien n'a été posé) et ça se signale ; après un
# apply c'est un DÉFAUT (le paquet devait poser son unité) et ça échoue.
- name: Relever les unités connues de systemd
  ansible.builtin.service_facts:
  become: true

- name: Établir si l'unité du moteur existe
  ansible.builtin.set_fact:
    sentinel_server_unite_existe: >-
      {{ sentinel_server_unite in (ansible_facts.services | default({})) }}

- name: S'assurer que le moteur n'est ni activé ni démarré
  ansible.builtin.systemd_service:
    name: "{{ sentinel_server_unite }}"
    enabled: false
    state: stopped
  become: true
  when:
    - not (sentinel_server_enabled | bool)
    - sentinel_server_unite_existe | bool

- name: Signaler que l'unité n'existe pas encore — attendu en `--check`
  ansible.builtin.set_fact:
    sentinel_server_points_signales: >-
      {{ sentinel_server_points_signales + [
           "Unité " ~ sentinel_server_unite ~ " ABSENTE : en --check, apt n'a "
           ~ "rien installé, donc systemd ne connaît pas encore l'unité. NON "
           ~ "JOUÉ ici : « ni activée ni démarrée » se vérifiera à l'apply. "
           ~ "Ce --check ne prouve donc PAS que le moteur restera à l'arrêt."
         ] }}
  when:
    - not sentinel_server_unite_existe | bool
    - ansible_check_mode

- name: Refuser de continuer si l'unité manque APRÈS une pose réelle
  ansible.builtin.fail:
    msg: >-
      L'unité {{ sentinel_server_unite }} est absente alors que le paquet
      {{ sentinel_server_paquet }} vient d'être installé pour de bon (hors
      --check). Le paquet n'a pas posé son unité, ou son nom a changé de version
      en version. On NE POURSUIT PAS : la suite du rôle croirait avoir garanti
      « ni activée ni démarrée » sur une unité qu'elle n'a jamais vue, et c'est
      exactement le faux vert que .agent/RULES.md § 1 interdit.
  when:
    - not sentinel_server_unite_existe | bool
    - not ansible_check_mode

# ── 5. La configuration, rendue depuis un template ────────────────────────
- name: Rendre la configuration du manager
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: "{{ sentinel_server_ossec_conf }}"
    owner: "{{ sentinel_server_owner }}"
    group: "{{ sentinel_server_group }}"
    mode: "{{ sentinel_server_config_mode }}"
    # Une configuration invalide laisse le manager mort au prochain démarrage,
    # et on l'apprend au pire moment. On garde la précédente sous la main.
    backup: true
  become: true
  notify: redemarrer le serveur central

# ── Le contrôle qui évite un démarrage impossible à diagnostiquer ─────────
# `wazuh-control` ne lit pas le XML : il cherche les balises `auth` et `cluster`
# par un `grep -n`, prend le numéro de ligne pour délimiter le bloc, et passe le
# tout à `sed`. Une SECONDE occurrence de la balise — dans un commentaire, par
# exemple — lui donne deux numéros, son `sed` échoue, il attend soixante
# secondes puis déclare « wazuh-authd did not start correctly » : l'unité
# ENTIÈRE refuse de démarrer, pour un commentaire. Mesuré 4.14.7 en répétition
# à blanc, et le message d'erreur ne dit rien de la vraie cause.
- name: Relever les balises que `wazuh-control` compte dans la configuration
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -c '<auth>\|</auth>\|<cluster>\|</cluster>' {{ sentinel_server_ossec_conf }}
      || true
    executable: /bin/bash
  become: true
  register: sentinel_server_balises_comptees
  changed_when: false
  check_mode: false
  failed_when: false

- name: Aucune balise `auth` ou `cluster` en double dans la configuration
  ansible.builtin.assert:
    that:
      - (sentinel_server_balises_comptees.stdout | default('0') | trim | int) <= 2
    fail_msg: >-
      La configuration rendue contient plus de deux occurrences des balises que
      `wazuh-control` compte (auth / cluster) :
      {{ sentinel_server_balises_comptees.stdout | default('?') | trim }}
      trouvées. Presque toujours un COMMENTAIRE qui cite la balise. Conséquence :
      le moteur refuse de démarrer avec « wazuh-authd did not start correctly »,
      soixante secondes plus tard, sans dire pourquoi. Retirer les chevrons du
      commentaire dans templates/ossec.conf.j2 — le nom de la balise en toutes
      lettres suffit à se faire comprendre.
    success_msg: "balises auth/cluster : une paire, comme il faut"
    quiet: true
  when: not ansible_check_mode

- name: Rendre la configuration de l'API — écoute sur le tailnet seul
  ansible.builtin.template:
    src: api.yaml.j2
    dest: "{{ sentinel_server_api_conf }}"
    owner: "{{ sentinel_server_owner }}"
    group: "{{ sentinel_server_group }}"
    mode: "{{ sentinel_server_config_mode }}"
    backup: true
  become: true
  notify: redemarrer le serveur central

# ── 6. Le secret d'enrôlement — posé, jamais affiché ──────────────────────
# La valeur vient du `.env` de la machine, lu en préconditions. Elle ne
# transite ni par le dépôt, ni par l'inventaire, ni par la sortie d'une tâche.
- name: Extraire la clé d'enrôlement du `.env` de la machine
  ansible.builtin.set_fact:
    sentinel_server_enroll_key: >-
      {{ (sentinel_server_env_brut.content | b64decode)
         | regex_search('(?m)^\s*SENTINEL_ENROLL_KEY\s*=\s*(\S+)', '\1')
         | first }}
  no_log: true

- name: Poser le secret d'enrôlement
  ansible.builtin.copy:
    content: "{{ sentinel_server_enroll_key }}\n"
    dest: "{{ sentinel_server_authd_pass }}"
    owner: "{{ sentinel_server_owner }}"
    group: "{{ sentinel_server_group }}"
    mode: "{{ sentinel_server_secret_mode }}"
  become: true
  no_log: true
  notify: redemarrer le serveur central

- name: Signaler que la fenêtre d'enrôlement est FERMÉE
  ansible.builtin.set_fact:
    sentinel_server_points_signales: >-
      {{ sentinel_server_points_signales + [
           "Enrôlement FERMÉ (wazuh-authd disabled). Aucun agent ne pourra "
           ~ "s'inscrire tant que la fenêtre n'est pas ouverte — c'est l'état "
           ~ "nominal : authd écoute sur 0.0.0.0 et Wazuh ne sait pas le lier "
           ~ "au tailnet (C4). Ouvrir le temps d'inscrire les agents : -e "
           ~ "{sentinel_server_authd_ouvert: true}, puis REFERMER. Runbook "
           ~ "mise-en-service § 2."
         ] }}
  when: not (sentinel_server_authd_ouvert | bool)

- name: Signaler que la fenêtre d'enrôlement est OUVERTE
  ansible.builtin.set_fact:
    sentinel_server_points_signales: >-
      {{ sentinel_server_points_signales + [
           "Enrôlement OUVERT : wazuh-authd écoutera sur 0.0.0.0:"
           ~ sentinel_server_port_enrolement ~ " — donc AUSSI sur le LAN, "
           ~ "puisque Wazuh ne sait pas le lier au tailnet. État TRANSITOIRE, "
           ~ "à refermer dès les agents inscrits. Le contrôle d'écoute de "
           ~ "l'armement refusera cet état, et c'est voulu : la fenêtre "
           ~ "s'ouvre sur un serveur déjà armé, puis se referme."
         ] }}
  when: sentinel_server_authd_ouvert | bool

# ── 7. Ce qu'on refuse de jouer, et qu'on signale ─────────────────────────
# Le bornage `cgroup` (condition 1 d'ADR-003) et l'arrêt pendant la relève
# (condition 2) appartiennent à `P01.4`. Tant qu'ils ne sont pas posés, armer
# ce serveur ferait cohabiter le moteur avec le miroir Postgres SANS plafond.
# Le rôle ne le décide pas à la place du PO : il l'inscrit au bilan.
- name: Relever si le bornage des ressources est déjà posé
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ sentinel_server_unite }}.d/sentinel-bornage.conf"
  register: sentinel_server_bornage
  become: true
  failed_when: false
  changed_when: false

- name: Signaler l'absence de bornage des ressources
  ansible.builtin.set_fact:
    # Guillemets DOUBLES : `\'` dans une chaîne Jinja simple-quotée n'est pas
    # l'échappement qu'on croit — le lexer coupe à l'apostrophe et la tâche ne se
    # charge même pas. Le français en est plein. Mesuré en CI le 2026-09-09.
    sentinel_server_points_signales: >-
      {{ sentinel_server_points_signales + [
           "Bornage cgroup ABSENT (conditions 1 et 2 d'ADR-003, lot P01.4). "
           ~ "Le moteur cohabiterait avec le miroir Postgres et la relève sans "
           ~ "plafond mémoire. NON JOUÉ ici : P01.4 le pose. Ne pas armer avant."
         ] }}
  when: >-
    'stat' not in sentinel_server_bornage
    or not sentinel_server_bornage.stat.exists
