---
# Pose du bornage et de l'interlock.
#
# Le PLAFOND se pose toujours — c'est une contrainte, pas un geste.
# L'INTERLOCK se pose désarmé — unité et timer installés, ni activés ni démarrés.

# ══ CONDITION 1 — le plafond, permanent et inconditionnel ═════════════════
# systemd applique les limites d'un cgroup À CHAUD après `daemon-reload` :
# poser ce plafond ne demande PAS de redémarrer le moteur. C'est ce qui permet
# à ce rôle d'être rejoué sur une machine en production sans rien redémarrer —
# la règle de `host_baseline` dans HQ, et elle vaut ici (docs/contrat-hq.md).
- name: Créer le répertoire de surcharge de l'unité bornée
  ansible.builtin.file:
    path: "{{ sentinel_bornage_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Poser le plafond de ressources du serveur central
  ansible.builtin.template:
    src: sentinel-bornage.conf.j2
    dest: "{{ sentinel_bornage_dropin }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: recharger le gestionnaire de services

# Le plafond doit être appliqué MAINTENANT, pas au prochain handler : le rôle
# `sentinel_server` refuse de s'armer sans lui, et un plafond posé mais non
# rechargé est un fichier, pas une limite.
- name: Appliquer le plafond immédiatement
  ansible.builtin.meta: flush_handlers

# ══ CONDITION 2 — l'interlock, posé désarmé ═══════════════════════════════
- name: Créer le répertoire des exécutables de Sentinelle
  ansible.builtin.file:
    path: "{{ sentinel_install_dir }}/bin"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Poser le script d'interlock de relève
  ansible.builtin.template:
    src: sentinel-interlock-releve.sh.j2
    dest: "{{ sentinel_bornage_interlock_script }}"
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Poser l'unité et le timer de l'interlock
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ sentinel_bornage_interlock_unite }}"
    - "{{ sentinel_bornage_interlock_timer }}"
  become: true
  notify: recharger le gestionnaire de services

# Rendre l'unité visible à `systemctl status` sans l'activer. Recharger ne
# démarre rien — c'est précisément ce qui permet à un `--check` de montrer ce
# que l'armement fera, avant que quiconque l'arme.
- name: Recharger le gestionnaire de services sans rien démarrer
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# En `--check` sur un hôte vierge, les deux unités ci-dessus n'ont été que
# SIMULÉES : systemd ne les connaît pas, et `systemd_service` échouait dessus
# (« Could not find the requested service … »). Le dépôt IMPOSE `--check --diff`
# en premier geste : le contrôle obligatoire ne rendait donc pas son verdict la
# première fois — et comme ce rôle passe AVANT `sentinel_server` dans
# `01_server.yml`, il arrêtait le tout premier `--check` du serveur central.
# Même défaut, même parade que `P01.15` sur les deux autres rôles. Mesuré en
# répétition à blanc sur un conteneur systemd vierge, 2026-09-10.
#
# Absente ne veut pas dire la même chose des deux côtés : en `--check` c'est
# NORMAL (rien n'a été écrit) et ça se signale ; après un apply c'est un DÉFAUT
# (nous venons de poser ces unités nous-mêmes) et le rôle refuse de continuer.
# On relève les FICHIERS d'unité, pas `service_facts` : mesuré en répétition à
# blanc, `service_facts` ne liste que les `.service` — le `.timer` en était
# absent APRÈS un apply réussi, et la garde ci-dessous arrêtait le rôle sur une
# unité pourtant bien posée. Ces deux unités sont écrites par ce rôle, à un
# chemin qu'il connaît : les regarder là où il vient de les poser est à la fois
# plus simple et plus vrai.
- name: Relever les fichiers d'unité de l'interlock
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  become: true
  register: sentinel_bornage_fichiers_unites
  changed_when: false
  loop:
    - "{{ sentinel_bornage_interlock_timer }}"
    - "{{ sentinel_bornage_interlock_unite }}"

- name: Établir si les unités de l'interlock existent
  ansible.builtin.set_fact:
    sentinel_bornage_unites_absentes: >-
      {{ sentinel_bornage_fichiers_unites.results
         | rejectattr('stat.exists')
         | map(attribute='item') | list }}

- name: S'assurer que l'interlock n'est ni activé ni démarré
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - "{{ sentinel_bornage_interlock_timer }}"
    - "{{ sentinel_bornage_interlock_unite }}"
  become: true
  when:
    - not (sentinel_bornage_interlock_enabled | bool)
    - item not in sentinel_bornage_unites_absentes

- name: Signaler les unités que `--check` n'a pas pu poser
  ansible.builtin.set_fact:
    sentinel_bornage_points_signales: >-
      {{ sentinel_bornage_points_signales + [
           "Unités " ~ (sentinel_bornage_unites_absentes | join(', ')) ~
           " ABSENTES : en --check elles n'ont été que simulées, donc systemd "
           ~ "ne les connaît pas. NON JOUÉ ici : « ni activée ni démarrée » se "
           ~ "vérifiera à l'apply. Ce --check ne prouve donc PAS que "
           ~ "l'interlock restera à l'arrêt."
         ] }}
  when:
    - sentinel_bornage_unites_absentes | length > 0
    - ansible_check_mode

- name: Refuser de continuer si une unité manque APRÈS une pose réelle
  ansible.builtin.fail:
    msg: >-
      {{ sentinel_bornage_unites_absentes | join(', ') }} : absente(s) de
      systemd alors que ce rôle vient de poser ces unités pour de bon (hors
      --check) et d'appeler `daemon-reload`. On NE POURSUIT PAS : la suite
      croirait avoir garanti « ni activée ni démarrée » sur une unité qu'elle
      n'a jamais vue, et c'est exactement le faux vert que
      .agent/RULES.md § 1 interdit.
  when:
    - sentinel_bornage_unites_absentes | length > 0
    - not ansible_check_mode

# ── Ce qu'on signale sans le jouer ────────────────────────────────────────
- name: Signaler que l'interlock est posé mais désarmé
  ansible.builtin.set_fact:
    # Chaînes Jinja en GUILLEMETS DOUBLES : le français est plein d'apostrophes,
    # et `\'` dans une chaîne Jinja simple-quotée n'est pas l'échappement qu'on
    # croit — le lexer coupe la chaîne à l'apostrophe et la tâche ne se charge
    # même pas. Mesuré en CI le 2026-09-09.
    sentinel_bornage_points_signales: >-
      {{ sentinel_bornage_points_signales + [
           "Interlock de relève POSÉ mais DÉSARMÉ (condition 2 d'ADR-003). "
           ~ "Le plafond, lui, est actif — la condition 1 ne dépend pas de "
           ~ "l'interlock. Armer : geste d'exploitation, après confirmation "
           ~ "du chemin de l'état de la relève côté HQ (P00.5)."
         ] }}
  when: not (sentinel_bornage_interlock_enabled | bool)

- name: Signaler un chemin d'état de relève non confirmé
  ansible.builtin.set_fact:
    sentinel_bornage_points_signales: >-
      {{ sentinel_bornage_points_signales + [
           "Chemin de l'état de la relève NON CONFIRMÉ ("
           ~ hq_failover_state_file ~ "). Hypothèse calquée sur le témoin de "
           ~ "mode tournoi. À relever côté HQ et à consigner des DEUX côtés — "
           ~ "une frontière écrite d'un seul côté n'est pas une frontière."
         ] }}
  when: not (hq_failover_state_confirme | bool)
