---
# Pose de l'agent : dépôt vérifié, paquet épinglé, configuration, enrôlement.
# CE FICHIER NE DÉMARRE RIEN.

- name: Convertir la cadence FIM en secondes pour syscheck
  ansible.builtin.set_fact:
    sentinel_agent_fim_frequency_seconds: >-
      {{
        (sentinel_fim_scan_interval[:-1] | int * 3600)
        if sentinel_fim_scan_interval is match('^[0-9]+h$')
        else (
          (sentinel_fim_scan_interval[:-1] | int * 60)
          if sentinel_fim_scan_interval is match('^[0-9]+m$')
          else (sentinel_fim_scan_interval | int)
        )
      }}
  changed_when: false

- name: Créer le répertoire des trousseaux
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# `/tmp` est mondialement inscriptible et un nom fixe s'y devine. La clé y
# passait par trois opérations — écriture, relevé d'empreinte, dé-blindage —
# avec une fenêtre entre le contrôle et l'usage. Un répertoire créé pour
# l'occasion (`0700`, root) supprime la fenêtre plutôt que de la rétrécir.
# `P01.16` — même correction que dans `sentinel_server`, dont ce rôle a hérité
# le défaut en copiant le gabarit.
- name: Créer un répertoire temporaire privé pour la clé du dépôt
  ansible.builtin.tempfile:
    state: directory
    prefix: sentinel-agent-repo-key.
  become: true
  register: sentinel_agent_cle_repertoire
  check_mode: false

- name: Télécharger la clé du dépôt dans ce répertoire
  ansible.builtin.get_url:
    url: "{{ sentinel_server_repo_key_url }}"
    dest: "{{ sentinel_agent_cle_repertoire.path }}/GPG-KEY-WAZUH"
    owner: root
    group: root
    mode: "0600"
  become: true
  register: sentinel_agent_cle_telechargee
  # En `--check`, `get_url` ne télécharge pas : la vérification d'empreinte qui
  # suit n'a alors rien à lire. On le DIT plutôt que de laisser un `skipped`
  # passer pour un contrôle réussi.
  check_mode: false

- name: Relever l'empreinte de la clé effectivement servie
  ansible.builtin.command:
    cmd: >-
      gpg --show-keys --with-colons
      {{ sentinel_agent_cle_repertoire.path }}/GPG-KEY-WAZUH
  become: true
  register: sentinel_agent_empreinte_relevee
  changed_when: false
  check_mode: false

- name: L'empreinte servie correspond à l'empreinte attendue
  ansible.builtin.assert:
    that:
      - sentinel_agent_empreinte_relevee.stdout is search(sentinel_server_repo_key_fingerprint)
    fail_msg: >-
      EMPREINTE NON CONFORME. La clé servie par {{ sentinel_server_repo_key_url }}
      ne porte pas l'empreinte attendue ({{ sentinel_server_repo_key_fingerprint }}).
      NE PAS INSTALLER. Prévenir le PO.
    success_msg: "empreinte de la clé de dépôt : conforme"
    quiet: true

- name: Poser la clé du dépôt dans son propre trousseau
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /usr/share/keyrings/sentinel-wazuh.gpg
      {{ sentinel_agent_cle_repertoire.path }}/GPG-KEY-WAZUH
    creates: /usr/share/keyrings/sentinel-wazuh.gpg
  become: true

- name: Retirer le répertoire temporaire de la clé
  ansible.builtin.file:
    path: "{{ sentinel_agent_cle_repertoire.path }}"
    state: absent
  become: true
  when: sentinel_agent_cle_repertoire.path is defined

- name: Déclarer le dépôt de paquets du moteur
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/sentinel-wazuh.gpg]
      {{ sentinel_server_repo_url }} {{ sentinel_server_repo_suite }}
      {{ sentinel_server_repo_composant }}
    filename: sentinel-wazuh
    state: present
    update_cache: true
  become: true

- name: Épingler la version de l'agent au niveau d'apt
  ansible.builtin.template:
    src: apt-preferences-wazuh.j2
    dest: /etc/apt/preferences.d/sentinel-wazuh-agent.pref
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Interdire tout démarrage de service pendant l'installation
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Posé par 40KT1_SENTINEL, rôle sentinel_agent, le temps de l'installation.
      exit 101
    dest: /usr/sbin/policy-rc.d
    owner: root
    group: root
    mode: "0755"
  become: true

# Sur un hôte VIERGE en `--check`, la déclaration du dépôt n'a pas écrit son
# fichier : `apt` ne connaît donc pas encore `wazuh-agent`, et le module
# échouait avec « No package matching 'wazuh-agent' is available ». Le premier
# `--check` — celui que le dépôt impose avant tout apply — ne rendait donc pas
# son verdict. Même parade que dans `sentinel_server` (`P01.20`), et posée des
# deux côtés le même jour pour que les rôles jumeaux ne divergent pas.
- name: Relever si le dépôt du moteur est déjà déclaré sur la machine
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/sentinel-wazuh.list
  become: true
  register: sentinel_agent_depot_present
  changed_when: false

- name: Installer l'agent, à la version épinglée
  ansible.builtin.apt:
    name: "{{ sentinel_agent_paquet }}={{ sentinel_server_wazuh_version }}-*"
    state: present
    update_cache: true
  become: true
  when: not ansible_check_mode or sentinel_agent_depot_present.stat.exists
  notify: redemarrer l agent

- name: Signaler que l'installation n'a pas pu être simulée — attendu en `--check`
  ansible.builtin.set_fact:
    sentinel_agent_points_signales: >-
      {{ sentinel_agent_points_signales + [
           "Installation de " ~ sentinel_agent_paquet ~ " NON SIMULÉE : le "
           ~ "dépôt de paquets n'est pas encore déclaré sur cette machine, "
           ~ "donc apt ne connaît pas le paquet. Ce --check ne prouve donc PAS "
           ~ "que la version " ~ sentinel_server_wazuh_version ~ " est servie "
           ~ "par le dépôt. Rejouer un --check APRÈS le premier apply le "
           ~ "prouvera."
         ] }}
  when:
    - ansible_check_mode
    - not sentinel_agent_depot_present.stat.exists

- name: Geler la version contre les mises à jour automatiques
  ansible.builtin.dpkg_selections:
    name: "{{ sentinel_agent_paquet }}"
    selection: hold
  become: true
  when: not ansible_check_mode or sentinel_agent_depot_present.stat.exists

- name: Lever l'interdiction de démarrage
  ansible.builtin.file:
    path: /usr/sbin/policy-rc.d
    state: absent
  become: true

- name: Recharger le gestionnaire de services sans rien démarrer
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# En `--check`, `apt` n'installe rien : l'unité n'existe pas encore, et
# `systemd_service` échouait dessus. Le dépôt IMPOSE `--check --diff` en premier
# geste — le contrôle obligatoire ne rendait donc jamais son verdict la première
# fois, c'est-à-dire au seul moment où on en a besoin. `P01.15`, hérité de
# `sentinel_server` et corrigé des deux côtés à la fois.
#
# Absente ne veut pas dire la même chose des deux côtés, et c'est tout l'enjeu :
# en `--check` c'est NORMAL (rien n'a été posé) et ça se signale ; après un
# apply c'est un DÉFAUT (le paquet devait poser son unité) et ça échoue.
- name: Relever les unités connues de systemd
  ansible.builtin.service_facts:
  become: true

- name: Établir si l'unité de l'agent existe
  ansible.builtin.set_fact:
    sentinel_agent_unite_existe: >-
      {{ sentinel_agent_unite in (ansible_facts.services | default({})) }}

- name: S'assurer que l'agent n'est ni activé ni démarré
  ansible.builtin.systemd_service:
    name: "{{ sentinel_agent_unite }}"
    enabled: false
    state: stopped
  become: true
  when:
    - not (sentinel_agent_enabled | bool)
    - sentinel_agent_unite_existe | bool

- name: Signaler que l'unité n'existe pas encore — attendu en `--check`
  ansible.builtin.set_fact:
    sentinel_agent_points_signales: >-
      {{ sentinel_agent_points_signales + [
           "Unité " ~ sentinel_agent_unite ~ " ABSENTE : en --check, apt n'a "
           ~ "rien installé, donc systemd ne connaît pas encore l'unité. NON "
           ~ "JOUÉ ici : « ni activée ni démarrée » se vérifiera à l'apply. "
           ~ "Ce --check ne prouve donc PAS que l'agent restera à l'arrêt."
         ] }}
  when:
    - not sentinel_agent_unite_existe | bool
    - ansible_check_mode

- name: Refuser de continuer si l'unité manque APRÈS une pose réelle
  ansible.builtin.fail:
    msg: >-
      L'unité {{ sentinel_agent_unite }} est absente alors que le paquet
      {{ sentinel_agent_paquet }} vient d'être installé pour de bon (hors
      --check). Le paquet n'a pas posé son unité, ou son nom a changé de version
      en version. On NE POURSUIT PAS : la suite du rôle croirait avoir garanti
      « ni activée ni démarrée » sur une unité qu'elle n'a jamais vue, et c'est
      exactement le faux vert que .agent/RULES.md § 1 interdit.
  when:
    - not sentinel_agent_unite_existe | bool
    - not ansible_check_mode

- name: Rendre la configuration de l'agent
  ansible.builtin.template:
    src: ossec.conf.j2
    dest: "{{ sentinel_agent_ossec_conf }}"
    owner: "{{ sentinel_agent_owner }}"
    group: "{{ sentinel_agent_group }}"
    mode: "{{ sentinel_agent_config_mode }}"
    backup: true
  become: true
  notify: redemarrer l agent

- name: Relever si l'agent est déjà enrôlé
  ansible.builtin.stat:
    path: "{{ sentinel_agent_client_keys }}"
  register: sentinel_agent_cle_client
  become: true
  changed_when: false

- name: Établir l'état d'enrôlement
  ansible.builtin.set_fact:
    sentinel_agent_deja_enrolle: >-
      {{
        'stat' in sentinel_agent_cle_client
        and sentinel_agent_cle_client.stat.exists
        and (sentinel_agent_cle_client.stat.size | default(0) | int) > 0
      }}
  changed_when: false

# Secret posé en fichier — jamais en argument. `no_log` masque la sortie
# Ansible ; `/proc/<pid>/cmdline` ne ment pas. `agent-auth` lit authd.pass
# tout seul quand le fichier existe (même motif que sentinel_server).
- name: Poser le secret d'enrôlement (fichier, pas la ligne de commande)
  ansible.builtin.copy:
    content: "{{ sentinel_agent_enroll_key }}\n"
    dest: "{{ sentinel_agent_authd_pass }}"
    owner: "{{ sentinel_agent_owner }}"
    group: "{{ sentinel_agent_group }}"
    mode: "0640"
  become: true
  no_log: true
  when: not sentinel_agent_deja_enrolle

- name: Enrôler l'agent auprès du serveur central
  ansible.builtin.command:
    cmd: >-
      {{ sentinel_agent_ossec_dir }}/bin/agent-auth
      -m {{ sentinel_agent_server_host }}
      -p {{ sentinel_server_port_enrolement }}
      -A {{ inventory_hostname }}
    creates: "{{ sentinel_agent_client_keys }}"
  become: true
  when:
    - not sentinel_agent_deja_enrolle
    - not ansible_check_mode
  check_mode: false
  register: sentinel_agent_enrolement
  changed_when: sentinel_agent_enrolement.rc == 0

- name: Signaler l'enrôlement reporté en --check
  ansible.builtin.set_fact:
    sentinel_agent_points_signales: >-
      {{ sentinel_agent_points_signales + [
           "Enrôlement NON JOUÉ en --check : l'agent n'est pas encore enrôlé. "
           ~ "Un apply explicite (ordre PO) exécutera agent-auth."
         ] }}
  when:
    - not sentinel_agent_deja_enrolle
    - ansible_check_mode
