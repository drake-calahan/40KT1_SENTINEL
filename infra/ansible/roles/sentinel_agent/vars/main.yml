---
# Invariants du rôle `sentinel_agent` — NON surchargeables par l'inventaire.

sentinel_agent_prefixe_unites: "sentinel-"

sentinel_agent_unites_de_hq:
  - "40kt1-*"
  - "docker"
  - "containerd"
  - "tailscaled"
  - "ssh"
  - "ufw"

# Paquets interdits sur un nœud agent — profil frugal, cohérence avec le serveur.
sentinel_agent_paquets_interdits:
  - wazuh-manager
  - wazuh-indexer
  - wazuh-dashboard
  - opensearch
  - opensearch-dashboards

sentinel_agent_paquet: "wazuh-agent"

sentinel_agent_ossec_dir: "/var/ossec"
sentinel_agent_ossec_conf: "/var/ossec/etc/ossec.conf"
sentinel_agent_client_keys: "/var/ossec/etc/client.keys"

# Exception NOMMÉE au préfixe `sentinel-` : logiciel tiers (GABARIT.md § 3).
sentinel_agent_unite: "wazuh-agent.service"
sentinel_agent_unites_autorisees:
  - "wazuh-agent.service"
