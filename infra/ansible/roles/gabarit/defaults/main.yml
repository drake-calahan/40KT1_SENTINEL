---
# Valeurs par défaut du rôle `gabarit` — TOUTES surchargeables.
# À REMPLACER : « gabarit » par le nom du rôle, partout.
#
# Ce qui n'a pas vocation à être surchargé va dans `vars/main.yml`.

# --- La garde d'armement ----------------------------------------------------
# `false`, et cette valeur NE CHANGE JAMAIS dans le dépôt (`RULES` § 1).
# Armer se fait en `-e gabarit_enabled=true`, par un humain qui joue un runbook.
# La CI `garde-armement` refuse la PR qui passerait cette ligne à `true`.
gabarit_enabled: false

# --- L'unité systemd gérée par ce rôle --------------------------------------
# Le préfixe `sentinel-` n'est pas cosmétique : le handler de redémarrage
# l'AFFIRME avant d'agir, et le contrat avec HQ tient sur cette séparation
# (`40kt1-*` à HQ, `sentinel-*` ici). Voir docs/contrat-hq.md.
gabarit_unite: "sentinel-gabarit.service"

# Unités à redémarrer quand la configuration change. Le handler refuse tout ce
# qui ne commence pas par `sentinel-`.
gabarit_unites_a_redemarrer:
  - "{{ gabarit_unite }}"

# --- Chemins ----------------------------------------------------------------
# Dérivés des chemins partagés de `group_vars/all/main.yml`. Ne pas les
# recopier en dur : un chemin défini deux fois diverge.
gabarit_config_dir: "{{ sentinel_install_dir }}/gabarit"
gabarit_config_file: "{{ gabarit_config_dir }}/gabarit.conf"

# --- Propriété des fichiers posés -------------------------------------------
gabarit_owner: "root"
gabarit_group: "root"
gabarit_dir_mode: "0750"
gabarit_file_mode: "0640"
