# Configuration Ansible — 40KT1_SENTINEL
#
# Volontairement minimale. Tout ce qui décrit une MACHINE vit dans l'inventaire,
# pas ici : un réglage posé dans ce fichier s'applique à toutes les cibles, y
# compris celle pour laquelle il est faux.

[defaults]
inventory = inventory/production.yml
roles_path = roles
collections_path = collections
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
# Le diff par défaut : ce dépôt vise la production, et on veut voir ce qu'on
# change avant de le changer.
callbacks_enabled = profile_tasks
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Le tailnet est le seul chemin d'exploitation. Pas de rebond, pas d'agent
# forwarding : une clé qui traverse une machine intermédiaire est une clé de
# moins sous contrôle.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no
