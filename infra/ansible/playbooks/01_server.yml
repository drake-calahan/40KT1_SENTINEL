---
# 01_server.yml — Serveur central, profil frugal. Lot `P01.0`.
#
#   cd infra/ansible
#   ansible-playbook playbooks/01_server.yml --check --diff
#
# `--check --diff` D'ABORD, ordre PO de la session courante ENSUITE, apply en
# dernier (.agent/RULES.md § 2). La cible est `patator-standby`, qui porte le
# miroir Postgres et la relève en lecture seule du parc.
#
# Ce playbook POSE un serveur désarmé. Il n'arme rien.
#   armer        : -e '{"sentinel_server_enabled": true}'   (runbook, humain)
#   désinstaller : -e '{"sentinel_server_desinstaller": true}'
#
# Prérequis à jouer d'abord : `playbooks/00_check.yml`.

# ══════════════════════════════════════════════════════════════════════════
# PLAY 1 — Garde de cible (roles/GABARIT.md § 4.3).
# Un play qui vise un groupe vide n'exécute AUCUNE tâche : aucun bilan ne
# s'affiche et le code de retour est 0. Le seul endroit d'où on peut le voir
# est ici, en amont, en regardant l'inventaire plutôt que les machines.
# ══════════════════════════════════════════════════════════════════════════
- name: Garde de cible — le serveur central a-t-il un hôte ?
  hosts: localhost
  gather_facts: false
  connection: local
  tags:
    - always

  tasks:
    - name: Le groupe `sentinel_server` porte exactement un hôte
      ansible.builtin.assert:
        that:
          - groups['sentinel_server'] is defined
          - groups['sentinel_server'] | length == 1
        fail_msg: >-
          Le groupe « sentinel_server » porte
          {{ groups['sentinel_server'] | default([]) | length }} hôte(s) au lieu
          d'un seul. ADR-003 tranche UN hôte — patator-standby — et cet hôte ne
          se change pas après coup sans tout ré-enrôler. Zéro hôte : ce playbook
          rendrait « ok » sans rien toucher. Plusieurs : personne ne sait plus
          où vivent les preuves.
        success_msg: "cible : {{ groups['sentinel_server'] | join(', ') }}"
        quiet: true

# ══════════════════════════════════════════════════════════════════════════
# PLAY 2 — Le rôle.
# ══════════════════════════════════════════════════════════════════════════
- name: Serveur central Sentinelle — profil frugal, livré désarmé
  hosts: sentinel_server
  gather_facts: true
  become: false
  # `serial: 1` alors qu'il n'y a qu'un hôte : la contrainte est écrite
  # maintenant, pour qu'un second nœud ajouté un jour n'arrive pas en parallèle
  # sur une machine de production sans que personne n'y pense.
  serial: 1

  roles:
    - role: sentinel_server
      tags:
        - sentinel_server

# ══════════════════════════════════════════════════════════════════════════
# PLAY 3 — Bilan de play : combien d'hôtes ont RÉELLEMENT été touchés.
# Sur localhost, pour rester lisible même si la cible est injoignable — un
# bilan porté par la cible disparaît avec elle.
# ══════════════════════════════════════════════════════════════════════════
- name: Bilan de play — hôtes visés contre hôtes atteints
  hosts: localhost
  gather_facts: false
  connection: local
  tags:
    - always

  vars:
    vises: "{{ groups['sentinel_server'] | default([]) }}"
    # Un hôte que le play 2 n'a pas pu joindre n'a pas de faits collectés.
    # Le sens de l'erreur compte : un hôte joint aux faits incomplets serait
    # compté « non atteint », donc INCONNU — le bon côté.
    atteints: >-
      {{ vises | map('extract', hostvars)
               | selectattr('ansible_facts.distribution', 'defined')
               | map(attribute='inventory_hostname') | list }}

  tasks:
    - name: Compte des hôtes visés et atteints
      ansible.builtin.debug:
        msg:
          - "visés    ({{ vises | length }}) : {{ vises | join(', ') }}"
          - "atteints ({{ atteints | length }}) : {{ atteints | join(', ') | default('AUCUN', true) }}"

    - name: Refuser de conclure si aucun hôte n'a été atteint
      ansible.builtin.assert:
        that:
          - atteints | length > 0
        fail_msg: >-
          AUCUN hôte n'a été atteint : ce playbook n'a RIEN posé, et son silence
          ne vaut pas « tout va bien ». Vérifier le tailnet, puis l'IPv4 de
          patator-standby — ce nœud l'a perdue quatre fois en trois semaines
          (.agent/DISCOVERY.md).
        success_msg: "{{ atteints | length }} hôte(s) réellement touché(s)"
        quiet: true

    - name: Rappeler ce que ce playbook n'a PAS fait
      ansible.builtin.debug:
        msg:
          - "Le serveur central est POSÉ, pas armé — c'est l'état voulu."
          - "Armement : geste d'exploitation, par runbook, par un humain (RULES § 1)."
          - "Avant d'armer : le bornage cgroup (P01.4) est un refus dur du rôle."
          - "Le tableau d'armement de .agent/ACTIVE.md reste la seule source de « ce qui tourne »."
