---
# Variables partagées par tous les hôtes — Sentinelle.
#
# AUCUN SECRET ICI. Les trois secrets du dispositif (clé d'enrôlement, jeton
# d'API, webhook Discord) vivent dans le `.env` de la machine, gitignoré.
# Ce fichier pose des chemins et des seuils, pas des valeurs sensibles.

sentinel_name: "sentinel"

# --- Armement ---------------------------------------------------------------
# TOUT est désarmé par défaut, et ce n'est pas de la prudence de façade :
# armer est un geste d'exploitation, décrit par un runbook, joué par un humain.
# Un rôle qui armerait quelque chose au passage rendrait la question « qu'est-ce
# qui tourne sur cette machine ? » impossible à répondre autrement qu'en s'y
# connectant.
#
# L'ordre d'armement est celui du runbook : agent -> alerte -> réponse à blanc
# -> réponse armée. Chaque étape se pose avec sa propre variable, en `-e`.
sentinel_agent_enabled: false
sentinel_server_enabled: false
sentinel_alerting_enabled: false
sentinel_response_enabled: false
sentinel_response_dry_run: true

# --- Budget de remédiation (ADR-002) ----------------------------------------
# Trois gestes automatiques par heure glissante. Le troisième déclenche un
# rouge ; au-delà, le dispositif cesse d'agir jusqu'à intervention humaine.
# Aligné sur ADR-062 de 40KT1_HQ. Modifier ce nombre est une décision d'ADR,
# pas un réglage d'inventaire.
sentinel_response_budget_per_hour: 3

# --- Chemins ----------------------------------------------------------------
sentinel_install_dir: "/opt/sentinel"
sentinel_state_dir: "/var/lib/sentinel"
sentinel_log_dir: "/var/log/sentinel"

# Témoin de désarmement d'urgence, lu AVANT tout geste. C'est le frein hors
# bande — celui qui ne demande que SSH.
sentinel_disarm_file: "{{ sentinel_state_dir }}/response-disarmed"

# --- Ce qui appartient à 40KT1_HQ, et qu'on LIT seulement -------------------
# Le mode tournoi est posé et retiré par le PO, côté HQ. Sentinelle le lit.
# Deux automates qui se posent le même verrou est un mode de panne connu.
hq_tournament_mode_file: "{{ hq_stack_dir }}/node-state/tournament-mode"

# Chemin du pousseur d'alerte de HQ, réutilisé tel quel : un seul mécanisme,
# une seule preuve de câblage, deux destinations (salon et sujet distincts).
hq_notify_script: "{{ hq_stack_dir }}/scripts/notify.sh"

# --- L'état de la relève (ADR-003 condition 2, C3) --------------------------
# HQ arme et désarme la relève ; Sentinelle LIT cet état et s'efface. Elle ne
# l'arme, ne le désarme et ne le retarde jamais (docs/contrat-hq.md).
#
# ⚠️ CHEMIN NON CONFIRMÉ. Le contrat de frontière nomme l'objet — « l'état de la
# relève (armée / au repos) » — mais pas le fichier qui le porte.
#
# ── RELEVÉ DANS `40KT1_HQ` LE 2026-09-09 (arbitrage `A3` du PO) ────────────
# L'hypothèse précédente (`node-state/failover-armed`) était fausse : **ce
# fichier n'existe pas**, ni dans le dépôt HQ ni sur `patator-tower`.
# `scripts/failover.py` ne connaît que deux états persistés :
#
#   node-state/tournament-mode        présence = booléen. C'est CE drapeau qui
#                                     arme la bascule automatique : sans lui,
#                                     `evaluate()` rend « la bascule
#                                     automatique n'est pas armée ».
#   backups/failover-state.json       JSON d'historique : `failovers`,
#                                     `peer_down_since`, `last_failover_reason`.
#                                     Écrit à CHAQUE passage, donc présent en
#                                     permanence dès le premier run.
#
# Conséquence : le modèle de l'interlock — « le fichier témoin existe donc la
# relève est armée » — **ne s'applique pas** à `failover-state.json`, dont la
# présence ne veut rien dire. Il s'applique à `tournament-mode`.
#
# ⚠️ ET C'EST LÀ QU'UNE DÉCISION MANQUE, pas une mesure. « La relève s'arme »
# peut vouloir dire deux choses différentes :
#   (a) la bascule est ARMÉE (tournament-mode posé) — mais le standby sert
#       peut-être encore normalement, et la RAM n'est pas sous pression ;
#   (b) la bascule a EU LIEU (le standby sert la production) — c'est le cas
#       qui justifie `C3`, puisque le motif d'`ADR-003` est la mémoire.
# (b) correspond au motif ; (a) correspond au mécanisme déjà écrit. Lire (b)
# demande de PARSER un JSON, pas de constater une présence : ce n'est plus le
# même interlock. Question ouverte `P01.13`.
#
# Tant que `hq_failover_state_confirme` vaut `false`, l'interlock de `P01.4` se
# pose mais **refuse de s'armer** : un automate qui arrête le serveur de
# sécurité en se fondant sur un chemin deviné est pire que pas d'interlock —
# il s'arrêterait au hasard, ou jamais, sans qu'on sache lequel. Le drapeau
# reste donc à `false` : le chemin est maintenant RELEVÉ, mais le sens de
# « armée » n'est pas TRANCHÉ, et c'est le sens qui commande.
#
# À consigner des DEUX côtés en portant le jumeau du contrat dans HQ (`P00.5`) :
# une frontière écrite d'un seul côté n'est pas une frontière.
#
# La valeur ci-dessous suit l'issue (a) — le seul mécanisme qui existe
# réellement aujourd'hui. Elle ne s'arme pas pour autant.
#
# NOTER qu'elle vaut alors EXACTEMENT `hq_tournament_mode_file` ci-dessus. Deux
# variables pour un seul fichier, lu à deux fins différentes (moduler la
# réponse en `E4` · arrêter le serveur central en `C3`), c'est un signal : ou
# bien les deux besoins sont le même, ou bien `C3` visait (b) et il manque un
# second signal côté HQ. À trancher en `P01.13`, pas ici.
hq_failover_state_file: "{{ hq_stack_dir }}/node-state/tournament-mode"
hq_failover_state_confirme: false

# --- Bornage des ressources -------------------------------------------------
# Plafond appliqué au serveur central quand il cohabite avec un nœud de
# production (cas (a) d'ADR-003). Ce qui rend la condition VÉRIFIABLE plutôt
# que déclarative : sur les 16 Go du standby, 1,5 Go laisse le miroir Postgres
# et la relève en lecture seule respirer.
sentinel_server_memory_max: "1500M"
sentinel_server_cpu_quota: "40%"

# --- Intégrité : la liste courte, surveillée en temps réel (D1) -------------
# Volontairement COURTE. Trop large, le contrôle produit du bruit à chaque
# déploiement et finit désactivé ; trop étroit, il ne voit pas la porte dérobée.
sentinel_fim_realtime_paths:
  - /etc
  - "{{ hq_stack_dir }}/.env"
  - "{{ ansible_facts['env']['HOME'] | default('/home/' ~ ansible_user) }}/.ssh/authorized_keys"
  # P01.12 — cas critique F2 : clés SSH de root (règle 100101)
  - /root/.ssh/authorized_keys
  - /etc/systemd/system
  - "{{ hq_stack_dir }}/docker-compose.yml"
  - "{{ hq_stack_dir }}/scripts"
  - /usr/bin/tailscale
  # P01.11 — démon privilégié Tailscale (règle 100130 ne couvrait que le CLI)
  - /usr/sbin/tailscaled
  # P01.11 — binaire sudo Ubuntu 26.04 (règle 100131)
  - /usr/bin/sudo.ws

# Balayage complet, cadence lente (D2).
sentinel_fim_scan_interval: "12h"
