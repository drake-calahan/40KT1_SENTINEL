---
# Inventaire de production — Sentinelle.
#
# ⚠️ CES MACHINES SERVENT LA PRODUCTION.
# `patator-tower` sert `hq.40kt1.com`. `patator-standby` porte le miroir et la
# relève en lecture seule. Un playbook joué ici n'est pas un playbook de
# laboratoire : `--check --diff` d'abord, ordre PO ensuite, apply en dernier.
#
# Les comptes ci-dessous sont ceux qui EXISTENT sur les machines (`calahan` sur
# les deux nœuds Linux), repris de l'inventaire de `40KT1_HQ`. Ce ne sont pas
# des comptes de service à créer.
#
# --- L'HÔTE DU SERVEUR CENTRAL, ET POURQUOI CELUI-LÀ -------------------------
#
# `ADR-003` est **Acceptée** (2026-09-07) : le serveur central vit sur
# `patator-standby`, en profil frugal. Le groupe `sentinel_server` porte donc un
# hôte — et un seul. Il n'est plus vide, et ce n'est pas un commit qui a choisi :
# c'est une décision, écrite, datée, avec une revue au **2027-03-07**.
#
# `patator-standby` apparaît DEUX FOIS dans cet inventaire, et c'est voulu : il
# porte un agent (comme la tour) ET le serveur central. C'est le même hôte, donc
# les mêmes variables — elles sont définies une seule fois, sous
# `sentinel_agents_linux`, et le groupe `sentinel_server` ne fait que le
# référencer. Ne pas les recopier : deux définitions divergent toujours.
#
# La conséquence à ne jamais perdre de vue : sécurité et secours partagent un
# domaine de panne. C'est la dette assumée d'`ADR-003`, et c'est ce qui rend les
# conditions 1 (bornage `cgroup`) et 2 (arrêt pendant la relève) non
# négociables — lot `P01.4`.
#
# `patator-tower` a été écarté : un serveur qui surveille son propre hôte perd
# ses preuves avec lui.

all:
  children:

    # --- Les endpoints qui portent un agent --------------------------------
    sentinel_agents:
      children:
        sentinel_agents_linux:
          hosts:

            patator-tower:
              ansible_host: patator-tower.tail29e268.ts.net
              ansible_user: calahan
              ansible_connection: ssh
              ansible_python_interpreter: /usr/bin/python3

              # `sudo` CLASSIQUE, explicitement. Ubuntu 26.04 fait de sudo-rs le
              # `sudo` par défaut, et sa gestion du mot de passe hors TTY n'est
              # pas celle qu'Ansible attend : le playbook s'arrête sur
              # « Timeout (32s) waiting for privilege escalation prompt ».
              # Mesuré dans 40KT1_HQ le 2026-08-26 ; sans ce réglage, rien ne
              # passe sur ce nœud.
              ansible_become_exe: /usr/bin/sudo.ws

              sentinel_node_role: primary
              # Racine de la stack de production, SURVEILLÉE en lecture.
              # Sentinelle n'y écrit pas (voir docs/contrat-hq.md).
              hq_stack_dir: /srv/40kt1

            patator-standby:
              ansible_host: patator-standby.tail29e268.ts.net
              ansible_user: calahan
              ansible_connection: ssh
              ansible_python_interpreter: /usr/bin/python3

              sentinel_node_role: secondary
              # `~/40KT1_HQ` et non `/opt` : c'est le chemin que documentent les
              # runbooks de HQ, donc celui où vivent réellement le `.env`, le
              # compose et les scripts.
              hq_stack_dir: /home/calahan/40KT1_HQ

              # ⚠️ Défaut réseau récidivant : quatre pertes totales d'IPv4 en
              # trois semaines (28/08, 30/08, 05/09, 06/09), cause
              # NetworkManager. Un `--check` qui échoue ici n'est pas forcément
              # un défaut du playbook. Voir `.agent/DISCOVERY.md`.
              sentinel_flaky_network: true

        # Postes d'administration — phase 4, ALERTE SEULEMENT (question E6).
        # Vide aujourd'hui : `AEGIS-TOWER` n'entre au périmètre qu'en P04.0.
        sentinel_agents_workstations:

    # --- Le serveur central — hôte tranché par ADR-003 (C1) -----------------
    # Profil frugal : pas d'indexeur, pas de console. Écoute sur `tailscale0`
    # UNIQUEMENT (condition 3 d'ADR-003, vérifiée en `P01.0` par `ss -lntp`).
    sentinel_server:
      hosts:
        # Référence seule : les variables de cet hôte sont plus haut.
        patator-standby: {}
      vars:
        # Ce que le profil frugal veut dire, en clair, à un seul endroit.
        sentinel_server_profil: "frugal"
        # L'interface d'écoute. Jamais 0.0.0.0, jamais le nom public, jamais
        # Funnel, jamais cloudflared (C4). Le nom est résolu sur la machine par
        # le rôle : le mettre en dur ici serait une IP de tailnet figée.
        sentinel_server_listen_interface: "tailscale0"
